
# Most of the maintainers of this code are professional engineers,
# not professional Rubyists.  The style guide for this project
# has been modified accordingly, with explanations given below.
# Where a Cop is not listed, it uses the Rubocop defaults.

AllCops:
  Exclude:
    - 'data/**/*'
    - 'test/**/*'
  NewCops: enable

inherit_from:
  # vendored from http://s3.amazonaws.com/openstudio-resources/styles/rubocop.yml so a style
  # check does not depend on a plain-http fetch succeeding at run time
  - .rubocop-openstudio.yml

# =============== OpenStudio Standards Specific ===========
# Ignore file name convention; choices based on OpenStudio C++ class names
Metrics/AbcSize:
  Max: 200

Metrics/BlockLength:
  Max: 100

Naming/FileName:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/HashEachMethods:
  Enabled: false