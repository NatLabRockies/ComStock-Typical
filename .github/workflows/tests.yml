name: tests

# Runs the kept test set: the OpenstudioStandards module tests, the 90.1 Standard-class
# lookups, and the Standard-class method tests. The glob below is the same set that
# test/ci_tests.txt lists; regenerate that file when adding or removing a test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_simulation_tests:
        description: 'Skip the EnergyPlus-backed tests (qaqc and sql_file)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

jobs:
  minitest:
    runs-on: ubuntu-latest
    container:
      image: nrel/openstudio:3.10.0
    env:
      SKIP_SIMULATION_TESTS: ${{ inputs.skip_simulation_tests || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the test set
        run: |
          set -u
          rm -rf test/reports
          echo "CI=${CI:-unset} cwd=$PWD"
          failed=0
          for f in $(find test/modules test/90_1_general test/os_stds_methods \
                      -type f -name 'test_*.rb' | sort); do
            echo "::group::$f"
            if ! openstudio execute_ruby_script "$f"; then
              echo "FAILED: $f"
              failed=1
            fi
            echo "::endgroup::"
          done
          echo "Reports written:"
          ls -la test/reports 2>&1 || true
          exit $failed

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: test/reports/*.xml
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test/reports/*.xml
          check_name: minitest results
          require_tests: false
          fail_on_failure: false
